<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة الجوال — النسخة المحدثة</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#04070b;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 12px;font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;color:#c9d3de}
  .bar{background:#0d141b;border:1px solid #1f2b38;border-radius:12px;padding:10px 16px;font-size:13.5px;color:#e6edf3;max-width:400px;text-align:center;line-height:1.8}
  .bar b{color:#4fd1c5}
  .hint{font-size:12px;color:#8b98a5}
  .frame{width:390px;max-width:100%;box-shadow:0 20px 60px #000c;border-radius:18px;overflow:hidden;border:1px solid #1f2b38}
  iframe{display:block;width:100%;height:720px;border:0;background:#05080c}
</style>
</head>
<body>
  <div class="bar">📱 <b>معاينة الجوال — النسخة المحدثة</b><br>
    هذا موقعك الحي بعرض 390px (مقاس جوال).<br>
    <span class="hint">اضغط على <b>الخطوط الثلاثة</b> في أعلى اليمين لفتح القائمة</span></div>
  <div class="frame"><iframe id="site" src="index.html"></iframe></div>
</body>
</html>
